services:
  - type: web
    name: relay-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SEED_ON_START
        value: true
      - key: ENABLE_DEMO_ENDPOINTS
        value: true
